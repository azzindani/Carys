# The gates in docs/CODING-STANDARDS.md are described as "checked by tests,
# not by review" — but until now nothing ran them except a person who
# remembered to. This runs them on every push.
#
# What is NOT here, and why: `npm run test:e2e` drives a real browser against
# real imaging, and samples/ is 343MB of vendored fixtures that are
# deliberately not committed (see samples/.gitkeep). There is nothing honest to
# run it against on a clean runner, so e2e stays a local/pre-release gate via
# `npm run verify`, which sets CARYS_REQUIRE_SAMPLES=1 and fails on a fixture
# that is missing rather than skipping it.
#
# The accessibility audit IS here: it inspects chrome — rails, toolbars, docks,
# panels, forms — which renders with or without imaging, so a fixture-free
# runner still gets real coverage.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: build · lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the Dockerfile's NODE_TAG major so CI and the shipped
          # image cannot disagree about what passes.
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # audit:a11y drives a real browser over the built app. Chromium only —
      # the audit inspects the DOM and computed styles, which do not differ
      # per engine, so three browsers would cost minutes to learn nothing.
      - run: npx playwright install --with-deps chromium

      # build → typecheck:app → lint → test:unit → test:markers → build:app
      # → audit:a11y (WCAG 2.1 A/AA over 8 routes x 2 breakpoints).
      # No samples/ on the runner: suites that need a fixture skip and say so,
      # and the run reports the skip count rather than passing silently.
      - run: npm run ci

      - name: Report skipped suites
        if: always()
        run: npm run test:unit 2>&1 | grep -E '^# (tests|pass|fail|skipped)'

  image:
    name: docker build + run (sample-free)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The image's own RUN layer is the gate: .dockerignore drops samples/, so
      # this proves the build works from a clean tree. It did not, before the
      # fixture guards landed — 20 tests read samples/ unguarded and failed the
      # layer.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # into the local daemon, so the next step can run what was built
          load: true
          tags: carys:ci

      # Building is not shipping. This job only ever built the image, and the
      # image exited 1 at start-up for as long as it existed (the stock nginx
      # config cannot run as the non-root user the Dockerfile switches to).
      # Run it the locked-down way the README documents; a start-up failure
      # fails here, before anything else is spent.
      - name: Run the image
        run: |
          docker run -d --name carys -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL carys:ci
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/healthz

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      # Docker's first health probe fires one interval (30s) after start; the
      # installs above cover that wait. This proves the HEALTHCHECK command
      # itself works, not just the endpoint it calls.
      - name: Healthcheck reports healthy
        run: timeout 60 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" carys)" = healthy ]; do sleep 2; done'

      # deploy/nginx.conf is live nowhere else: headers, cache policy and
      # compression over HTTP, then Chromium boots the app and every route
      # under the real CSP. No samples on the runner, so the imaging legs
      # report as skipped.
      - run: npm run test:image
        env:
          CARYS_URL: http://127.0.0.1:8080

      - name: Container log
        if: always()
        run: docker logs carys 2>&1 | tail -50
