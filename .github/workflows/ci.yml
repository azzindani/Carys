# The gates in docs/CODING-STANDARDS.md are described as "checked by tests,
# not by review" — but until now nothing ran them except a person who
# remembered to. This runs them on every push.
#
# What is NOT here, and why: `npm run test:e2e` drives a real browser against
# real imaging, and samples/ is 343MB of vendored fixtures that are
# deliberately not committed (see samples/.gitkeep). There is nothing honest to
# run it against on a clean runner, so e2e stays a local/pre-release gate via
# `npm run verify`, which sets CARYS_REQUIRE_SAMPLES=1 and fails on a fixture
# that is missing rather than skipping it.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: build · lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the Dockerfile's NODE_TAG major so CI and the shipped
          # image cannot disagree about what passes.
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # build → typecheck:app → lint → test:unit → test:markers → build:app.
      # No samples/ on the runner: suites that need a fixture skip and say so,
      # and the run reports the skip count rather than passing silently.
      - run: npm run ci

      - name: Report skipped suites
        if: always()
        run: npm run test:unit 2>&1 | grep -E '^# (tests|pass|fail|skipped)'

  image:
    name: docker build (sample-free)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The image's own RUN layer is the gate: .dockerignore drops samples/, so
      # this proves the build works from a clean tree. It did not, before the
      # fixture guards landed — 20 tests read samples/ unguarded and failed the
      # layer.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: carys:ci
