# Carys production compose: one read-only nginx container behind the shared
# Caddy router (/root/caddy-router), the same arrangement as Thoth.
#
#   sh deploy/up.sh        (builds the image, fills the sample set, starts)
#
# Exposure: the router joins `carys_edge`, which holds this container and
# nothing else, and proxies carys.casava.space to carys-app-1:8080. TLS and
# HSTS are the router's (deploy/nginx.conf leaves both to the proxy in front).
# The loopback port is for host checks only.
#
# Access: the image's token gate (deploy/gate.js, Thoth's model). This file
# requires CARYS_ACCESS_KEY, which compose reads from deploy/.env (gitignored,
# mode 600; up.sh creates it), so production cannot start open by mistake.
# Log in once per browser at https://carys.casava.space/?token=<key>.

name: carys

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  app:
    # Built by deploy/up.sh with `docker build` so the in-image gate runs
    # once, then started here without rebuilding.
    image: carys:prod
    build:
      context: ..
    environment:
      # Unset or empty: any https origin plus loopback (deploy/start.sh).
      CARYS_CONNECT_SRC: ${CARYS_CONNECT_SRC:-}
      CARYS_ACCESS_KEY: ${CARYS_ACCESS_KEY:?set CARYS_ACCESS_KEY in deploy/.env (sh deploy/up.sh creates one)}
    volumes:
      - ${CARYS_SAMPLES:?set CARYS_SAMPLES to the sample set to serve}:/usr/share/nginx/html/samples:ro
    ports:
      - "127.0.0.1:${CARYS_PORT:-8090}:8080"
    networks:
      - edge
    # the locked-down run the README documents and CI tests
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # static files: one core and a little memory is plenty, and a
          # shared host keeps the rest
          cpus: "1.0"
          memory: 256M
    logging: *logging

networks:
  edge:
    name: carys_edge
