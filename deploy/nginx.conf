# Carys production server: static files only. No proxy, no backend, no
# secrets. Installed as /etc/nginx/nginx.conf by the Dockerfile's serve stage.
#
# The image runs as the unprivileged `nginx` user, and the stock config was
# written for root: it binds :80 and writes its pid to /run and its temp files
# to /var/cache/nginx, both root-owned. The image built green in CI and exited
# 1 at start-up ("mkdir() /var/cache/nginx/client_temp failed (13: Permission
# denied)"), unnoticed because nothing ever ran it. Hence 8080 (a port below
# 1024 needs a capability that Kubernetes' restricted profile and rootless
# runtimes do not grant), and every writable path under /tmp, which also lets
# the container run with a read-only root filesystem plus a tmpfs on /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Imaging formats the stock table does not know. None but DICOM has a
    # registered type; the x- names are the convention for unregistered ones.
    # They matter for two reasons: a distinct type is what lets gzip pick
    # these out below without also re-compressing every unknown binary, and
    # under nosniff a type is the whole story the browser gets. Zarr is
    # handled per location below: its metadata files have no extension.
    types {
        application/dicom        dcm;
        application/x-nifti      nii;
        application/x-nrrd       nrrd nhdr;
        application/x-mz3        mz3;
        application/gzip         gz;
        chemical/x-cif           cif mmcif;
        text/javascript          mjs;
    }

    # $carys_connect_src: the site's connect-src origins, rendered from
    # CARYS_CONNECT_SRC by deploy/start.sh before nginx starts. nginx refuses
    # to start without it, so the header can never go out half-built.
    include /tmp/carys-connect-src.conf;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Compression. Uncompressed volumes are mostly air and runs of equal
    # voxels: the sample NIfTIs shrink 3-9x (a 17.9MB FLAIR to 1.9MB), CT
    # DICOM about 1.7x. For a viewer that pulls tens of MB per series that is
    # the biggest win in this file. Formats that are already compressed are
    # left out: .gz (so .nii.gz is not wrapped twice), images, fonts, zips,
    # and NRRD, whose payload usually says `encoding: gzip` itself. The app's
    # own JS/CSS is pre-compressed at build time (gzip_static below); this
    # covers everything else.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css text/plain text/javascript application/javascript
        application/json image/svg+xml application/wasm
        application/dicom application/x-nifti application/x-mz3
        chemical/x-pdb chemical/x-cif;

    # Cache policy by path, set once at server level. nginx drops every
    # inherited add_header in a location that declares its own, so per-location
    # Cache-Control would silently strip the security headers from exactly the
    # responses that set it; a map keeps one list of headers for all of them.
    map $uri $carys_cache_control {
        # Vite names everything under assets/ by content hash: a changed file
        # is a new URL, so the old one can be kept forever.
        ~^/packages/app/dist/assets/  "public, max-age=31536000, immutable";
        # The mount point for a site's own volumes, which may be patient
        # images: private keeps them out of shared proxies and CDNs. Short, so
        # a swapped mount shows up within minutes; cached at all because a
        # series is tens of MB, and a DICOM series is one request per slice —
        # reopening one should not cost 120 round trips.
        ~^/samples/                   "private, max-age=300, must-revalidate";
        # Vendored atlases and structures: public data that changes only when
        # the image does.
        ~^/digests/                   "public, max-age=300, must-revalidate";
        # index.html and anything else unhashed: always revalidate (an ETag
        # makes that a 304). A stale index.html would name chunks the current
        # image no longer has.
        default                       "no-cache";
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirects carry a relative Location. An absolute one is built from
        # the port nginx listens on (8080), which is wrong whenever the
        # container is published on any other port.
        absolute_redirect off;

        # `always` puts these on error responses too; a 404 page is still a
        # page. Cache-Control is the exception: without `always` it is not sent
        # on a 404, so a missing hashed asset is never cached as "immutable".
        #
        # Content-Security-Policy. The app is built so this can be strict:
        #   script-src 'self'    Vite emits external module scripts only. No
        #                        inline script, eval, new Function or WebAssembly
        #                        in the bundle — so no 'unsafe-*' of any kind. (A
        #                        WASM codec would need 'wasm-unsafe-eval' here and
        #                        nothing broader.)
        #   style-src 'self'     one bundled stylesheet. React writes style props
        #                        through the CSSOM, which CSP does not govern, and
        #                        no component injects a <style> element.
        #   font-src 'self'      fonts are bundled (index.css), not Google's.
        #   img-src data:        the select chevron is an inline SVG data URI in
        #                        components.css. Downloads use blob:/data: links,
        #                        which are navigations, not image loads.
        #   worker-src 'self'    both workers are `new Worker(new URL(...))`,
        #                        which Vite emits as files under assets/ — not
        #                        blob: workers.
        #   connect-src          the one real relaxation. The app fetches stores
        #                        the user types in: OME-Zarr URLs (Cells), DICOMweb
        #                        endpoints (worklist PACS panel), the IDR mirrors on
        #                        EBI's S3. Their hosts are unknowable at build time,
        #                        so by default any https origin is allowed; a site
        #                        that can name its hosts sets CARYS_CONNECT_SRC
        #                        (deploy/start.sh) and gets exactly those. The
        #                        default gives up
        #                        connect-src as an exfiltration barrier; the barrier
        #                        is script-src, which lets no injected code run in
        #                        the first place. Plain http is refused except on
        #                        loopback, where a workstation PACS lives (Orthanc
        #                        defaults to http://localhost:8042) and which
        #                        browsers treat as secure even from an https page.
        #                        A LAN PACS on plain http needs its origin added
        #                        here — and, if Carys is served over https, TLS on
        #                        the PACS, because mixed-content blocking refuses
        #                        http:// fetches whatever this header says.
        #   frame-ancestors, base-uri, form-action: nothing frames Carys, it sets
        #                        no <base> and it submits no forms.
        # upgrade-insecure-requests and HSTS are deliberately absent: TLS ends at
        # whatever proxy fronts this container, and that proxy owns both.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' $carys_connect_src; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        # The app fetches from hosts it does not control (zarr stores, PACS,
        # IDR); none of them needs to learn where a clinical viewer lives.
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Other sites may not embed these bytes (volumes included) either.
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control $carys_cache_control;

        # Liveness for the Dockerfile HEALTHCHECK and orchestrators: answered by
        # nginx itself, so it proves the server is up without touching disk.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The app is the product. 302, not 301: a permanent redirect is cached
        # by browsers indefinitely, and the landing page should stay ours to
        # change.
        location = / {
            return 302 /packages/app/dist/;
        }

        # The Dockerfile writes a .gz beside each compressible app file, so the
        # hot path is compressed once at -9 instead of per request at -5.
        location /packages/app/dist/ {
            gzip_static on;
        }

        # Volumes are compressed per request (the mount is read-only, so
        # nothing can pre-compress them), and at that size the level is a CPU
        # budget: on a 44MB CT, level 1 takes 0.9s for 3.0x and level 5 2.3s
        # for 3.2x. Every user opening a series pays it, so take the cheap one.
        location /samples/ {
            gzip_comp_level 1;
        }

        # Zarr v2 keeps its metadata in dotfiles (.zarray, .zattrs, .zgroup,
        # .zmetadata). To nginx a leading dot is not an extension, so the type
        # table never sees them and they would go out as octet-stream; they
        # are JSON. Chunk files (`0.0.0`, `c/0/0/0`) stay application/
        # octet-stream on purpose: stores normally compress their own chunks,
        # so gzip would spend CPU to save nothing. This is also why there is
        # no blanket "deny dotfiles" rule in this file: it would take every
        # OME-Zarr store down with it.
        location ~ /\.z(array|attrs|group|metadata)$ {
            types { }
            default_type application/json;
        }

        # The stock table already claims .pdb (Palm database, of all things),
        # and redefining an extension there logs a warning on every start. A
        # location-local table overrides it quietly, for protein files only.
        location ~* \.pdb$ {
            types { }
            default_type chemical/x-pdb;
        }
    }
}
